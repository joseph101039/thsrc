services:
  captcha:
    image: joseph50804/captcha-solver:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # 走 /health(已存在於既有 image);新加的 /healthz 要等 captcha image 重 build 部署後生效
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  server:
    build: ./server
    image: joseph50804/thsrc-server:latest
    ports:
      - "8081:8081"
    volumes:
      - db-data:/app/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8081/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: ./server
    image: joseph50804/thsrc-server:latest
    command: node --experimental-sqlite src/scheduler.js
    volumes:
      - db-data:/app/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      # scheduler 以 PID 1 啟動於 container,直接讀 /proc/1/cmdline 確認仍是 scheduler.js
      test: ["CMD-SHELL", "tr -d '\\0' < /proc/1/cmdline | grep -q scheduler.js"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s

  alloy:
    # Grafana Alloy:scrape server:8081 / scheduler:8082 /metrics → remote_write 到 Grafana Cloud
    # 走 internal docker network,不對外開 port
    # 釘版號避免 alloy major 升版意外 break;升版時手動測試後再 bump
    image: grafana/alloy:v1.16.1
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    env_file: .env
    restart: unless-stopped
    depends_on:
      - server
      - scheduler

  watchtower:
    # containrrr/watchtower 已 archived (2024)；改用社群 active fork
    # nickfedor/watchtower 與原版 CLI/設定完全相容,且支援現代 Docker API
    image: nickfedor/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300
    restart: unless-stopped

volumes:
  db-data:
