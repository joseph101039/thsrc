{
  "openapi": "3.0.0",
  "info": {
    "title": "THSRC Booking API",
    "version": "1.0.0",
    "description": "高鐵自動訂票 API"
  },
  "servers": [
    {
      "url": "http://localhost:8081"
    },
    {
      "url": "https://api.joseph101039.uk"
    },

  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Passenger": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "idNumber": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "adult",
              "student",
              "senior",
              "disabled",
              "child"
            ]
          },
          "email": {
            "type": "string"
          },
          "phone": {
            "type": "string"
          }
        }
      },
      "PassengerInput": {
        "type": "object",
        "required": [
          "name",
          "idNumber",
          "type",
          "email"
        ],
        "properties": {
          "id": {
            "type": "string",
            "description": "有值時為更新，否則為新增"
          },
          "name": {
            "type": "string"
          },
          "idNumber": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "adult",
              "student",
              "senior",
              "disabled",
              "child"
            ]
          },
          "email": {
            "type": "string"
          },
          "phone": {
            "type": "string"
          }
        }
      },
      "Booking": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "passengerId": {
            "type": "string"
          },
          "fromStation": {
            "type": "string"
          },
          "toStation": {
            "type": "string"
          },
          "date": {
            "type": "string",
            "example": "2026-05-10"
          },
          "desiredTime": {
            "type": "string",
            "example": "09:00"
          },
          "earliestTime": {
            "type": "string",
            "example": "08:00"
          },
          "latestTime": {
            "type": "string",
            "example": "10:00"
          },
          "maxRetries": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "running",
              "success",
              "failed"
            ]
          },
          "retryCount": {
            "type": "integer"
          },
          "trainNo": {
            "type": "string"
          },
          "ticketNo": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          },
          "updatedAt": {
            "type": "string"
          }
        }
      },
      "BookingInput": {
        "type": "object",
        "required": [
          "passengerId",
          "fromStation",
          "toStation",
          "date",
          "desiredTime",
          "earliestTime",
          "latestTime"
        ],
        "properties": {
          "passengerId": {
            "type": "string"
          },
          "fromStation": {
            "type": "string"
          },
          "toStation": {
            "type": "string"
          },
          "date": {
            "type": "string",
            "example": "2026-05-10"
          },
          "desiredTime": {
            "type": "string",
            "example": "09:00"
          },
          "earliestTime": {
            "type": "string",
            "example": "08:00"
          },
          "latestTime": {
            "type": "string",
            "example": "10:00"
          },
          "maxRetries": {
            "type": "integer",
            "default": 10
          },
          "scheduledAt": {
            "type": "string",
            "description": "ISO datetime，null 表示立即執行"
          }
        }
      },
      "BookingAttempt": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "bookingId": {
            "type": "string"
          },
          "attemptedAt": {
            "type": "string"
          },
          "success": {
            "type": "integer",
            "enum": [
              0,
              1
            ]
          },
          "reason": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "AllowedUser": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "user",
              "admin"
            ]
          },
          "createdAt": {
            "type": "string"
          }
        }
      }
    }
  },
  "paths": {
    "/v1/auth/google": {
      "post": {
        "summary": "Google OAuth 登入",
        "tags": [
          "Auth"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "credential"
                ],
                "properties": {
                  "credential": {
                    "type": "string",
                    "description": "Google ID token"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "登入成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "token": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "缺少 credential"
          },
          "401": {
            "description": "無效的 Google token"
          },
          "403": {
            "description": "帳號無權限"
          }
        }
      }
    },
    "/v1/bookings": {
      "get": {
        "summary": "取得所有訂票",
        "tags": [
          "Bookings"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "訂票列表",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "bookings": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Booking"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "建立訂票",
        "tags": [
          "Bookings"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BookingInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "建立成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/bookings/{id}": {
      "delete": {
        "summary": "刪除訂票",
        "tags": [
          "Bookings"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "刪除成功"
          }
        }
      }
    },
    "/v1/bookings/{id}/attempts": {
      "get": {
        "summary": "取得訂票嘗試記錄",
        "tags": [
          "Bookings"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "嘗試記錄列表",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "attempts": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/BookingAttempt"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/passengers": {
      "get": {
        "summary": "取得所有旅客",
        "tags": [
          "Passengers"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "旅客列表",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "passengers": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Passenger"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "新增或更新旅客",
        "tags": [
          "Passengers"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PassengerInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "儲存成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/passengers/{id}": {
      "delete": {
        "summary": "刪除旅客",
        "tags": [
          "Passengers"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "刪除成功"
          }
        }
      }
    },
    "/v1/users": {
      "get": {
        "summary": "取得所有允許使用者（admin only）",
        "tags": [
          "Users"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "使用者列表",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "users": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/AllowedUser"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "新增允許使用者（admin only）",
        "tags": [
          "Users"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email",
                  "role"
                ],
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "role": {
                    "type": "string",
                    "enum": [
                      "user",
                      "admin"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "新增成功或失敗",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "error": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/users/{email}": {
      "delete": {
        "summary": "刪除允許使用者（admin only）",
        "tags": [
          "Users"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "email",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "刪除成功"
          },
          "400": {
            "description": "不能刪除自己"
          }
        }
      }
    }
  },
  "tags": []
}