<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增訂票</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
  <header class="page-header">
    <button class="back-btn" onclick="history.back()">&#8592;</button>
    <h1>新增訂票</h1>
    <button class="logout-btn" onclick="window.__auth.logout()" title="登出" aria-label="登出">
      <span class="material-icons">logout</span>
    </button>
  </header>

  <main class="page-content">
    <div class="form-group">
      <label>乘客</label>
      <select id="b-passenger">
        <option value="">載入中...</option>
      </select>
    </div>

    <div class="form-group">
      <label>出發站 / 到達站</label>
      <div class="form-row-3">
        <select id="b-from"></select>
        <button class="swap-btn" onclick="swapStations()" title="互換">⇄</button>
        <select id="b-to"></select>
      </div>
    </div>

    <div class="form-group">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <label style="margin:0">搜尋條件</label>
        <div id="search-mode-toggle" style="display:flex;border:1px solid #4A90E2;border-radius:6px;overflow:hidden;font-size:13px">
          <button id="btn-mode-time" style="padding:4px 14px;background:#4A90E2;color:#fff;border:none;cursor:pointer" onclick="setSearchMode('time')">時間</button>
          <button id="btn-mode-train" style="padding:4px 14px;background:#fff;color:#4A90E2;border:none;cursor:pointer" onclick="setSearchMode('train')">車次</button>
        </div>
      </div>
    </div>

    <div id="time-fields">
      <div class="form-row">
        <div class="form-group">
          <label>乘車日期</label>
          <input type="date" id="b-date">
        </div>
        <div class="form-group">
          <label>期望時間</label>
          <input type="time" id="b-desired-time" value="09:00">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>允許最早</label>
          <input type="time" id="b-earliest">
        </div>
        <div class="form-group">
          <label>允許最晚</label>
          <input type="time" id="b-latest">
        </div>
      </div>
    </div>

    <div id="train-fields" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label>乘車日期</label>
          <input type="date" id="b-date-train">
        </div>
        <div class="form-group">
          <label>車次號碼</label>
          <input type="text" id="b-train-no-target" placeholder="例：0106" maxlength="10">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>最大重試次數</label>
      <input type="number" id="b-max-retries" value="10" min="1" max="50">
    </div>

    <div class="form-group">
      <label>票種</label>
      <div id="ticket-types" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span>全票</span>
          <div style="display:flex;align-items:center;gap:8px">
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('adult',-1)">−</button>
            <span id="ticket-adult-val" style="min-width:20px;text-align:center">1</span>
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('adult',1)">＋</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span>孩童票</span>
          <div style="display:flex;align-items:center;gap:8px">
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('child',-1)">−</button>
            <span id="ticket-child-val" style="min-width:20px;text-align:center">0</span>
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('child',1)">＋</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span>愛心票</span>
          <div style="display:flex;align-items:center;gap:8px">
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('disabled',-1)">−</button>
            <span id="ticket-disabled-val" style="min-width:20px;text-align:center">0</span>
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('disabled',1)">＋</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span>敬老票</span>
          <div style="display:flex;align-items:center;gap:8px">
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('senior',-1)">−</button>
            <span id="ticket-senior-val" style="min-width:20px;text-align:center">0</span>
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('senior',1)">＋</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span>大學生票</span>
          <div style="display:flex;align-items:center;gap:8px">
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('student',-1)">−</button>
            <span id="ticket-student-val" style="min-width:20px;text-align:center">0</span>
            <button type="button" class="btn btn-ghost" style="padding:2px 12px;font-size:16px" onclick="changeTicket('student',1)">＋</button>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>重試間隔</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="number" id="b-retry-wait-value" value="2" min="1" max="300" style="width:80px">
        <select id="b-retry-wait-unit">
          <option value="minute">分鐘</option>
          <option value="second">秒</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>訂票時機</label>
      <div class="toggle-group">
        <button id="btn-immediate" class="active" onclick="setMode('immediate')">立即開始</button>
        <button id="btn-scheduled" onclick="setMode('scheduled')">預約時間</button>
      </div>
    </div>

    <div class="form-row" id="scheduled-fields" style="display:none">
      <div class="form-group">
        <label>預約日期</label>
        <input type="date" id="b-schedule-date">
      </div>
      <div class="form-group">
        <label>預約時間</label>
        <input type="time" id="b-schedule-time">
      </div>
    </div>

    <div class="form-group" id="concurrency-field" style="display:none">
      <label>併發搶票數 <span style="color:#888;font-weight:normal">（1–5,熱門票位建議 2–3,過高易被高鐵識別）</span></label>
      <input type="number" id="b-concurrency" min="1" max="5" value="2">
    </div>

    <div class="alert alert-info">
      ℹ️ 搶票開始後系統將自動辨識驗證碼，完成後會收到高鐵 Email 通知。
    </div>

    <button class="btn btn-primary" id="submit-btn" onclick="submitBooking()">確認送出</button>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🎫</span>
      <span>訂票紀錄</span>
    </a>
    <a href="passengers.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>乘客設定</span>
    </a>
    <a href="admin.html" class="nav-item" id="nav-admin" hidden>
      <span class="nav-icon">👥</span>
      <span>使用者</span>
    </a>
    <a href="admin-settings.html" class="nav-item" id="nav-admin-settings" hidden>
      <span class="nav-icon">⚙️</span>
      <span>設定</span>
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/booking.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.__auth.getRole() === 'admin') {
        var el = document.getElementById('nav-admin');
        if (el) el.hidden = false;
        var el2 = document.getElementById('nav-admin-settings');
        if (el2) el2.hidden = false;
      }
    });
  </script>
</body>
</html>
