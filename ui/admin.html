<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用者管理</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
  <header class="page-header">
    <h1>使用者管理</h1>
    <button class="logout-btn" onclick="window.__auth.logout()" title="登出" aria-label="登出">
      <span class="material-icons">logout</span>
    </button>
  </header>

  <main class="page-content">
    <div id="users-list">
      <div class="loading">載入中...</div>
    </div>
  </main>

  <button class="fab" onclick="openAddModal()" title="新增使用者" aria-label="新增使用者">+</button>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🎫</span>
      <span>訂票紀錄</span>
    </a>
    <a href="passengers.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>乘客設定</span>
    </a>
    <a href="admin.html" class="nav-item active" id="nav-admin" hidden>
      <span class="nav-icon">👥</span>
      <span>使用者</span>
    </a>
    <a href="admin-settings.html" class="nav-item" id="nav-admin-settings" hidden>
      <span class="nav-icon">⚙️</span>
      <span>設定</span>
    </a>
  </nav>

  <!-- 新增使用者 Modal -->
  <div id="add-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;padding:16px;">
    <div style="background:white;border-radius:12px;padding:24px;width:100%;max-width:400px;">
      <div style="font-size:18px;font-weight:600;margin-bottom:16px;">新增使用者</div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="add-email" placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>角色</label>
        <select id="add-role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-ghost" style="flex:1" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" style="flex:1" id="add-confirm-btn" onclick="confirmAddUser()">新增</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.__auth.getRole() !== 'admin') {
        location.href = 'index.html';
        return;
      }
      var el = document.getElementById('nav-admin');
      if (el) el.hidden = false;
      var el2 = document.getElementById('nav-admin-settings');
      if (el2) el2.hidden = false;
    });
  </script>
</body>
</html>
